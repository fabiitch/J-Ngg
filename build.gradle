plugins {
    id 'java-library'
}

group = 'com.nz.jnng'
version = '1.0-SNAPSHOT'

sourceSets {
    main {
        java {
            srcDir("src/generated")
        }
    }
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}


repositories {
    mavenCentral()
}

dependencies {
    implementation("org.slf4j:slf4j-api:$slf4jVersion")

    testRuntimeOnly "org.apache.logging.log4j:log4j-api:$log4j2Version"
    testRuntimeOnly "org.apache.logging.log4j:log4j-core:$log4j2Version"
    testRuntimeOnly "org.apache.logging.log4j:log4j-slf4j2-impl:$log4j2Version"


    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"
}

compileTestJava {
    source += sourceSets.main.allJava
    classpath += sourceSets.main.output
}

test {
    useJUnitPlatform()
    classpath += sourceSets.main.output
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('graalvmMetadataApp', JavaExec) {
    group = 'verification'
    description = 'Exercises every native NNG call used by J-Nng for GraalVM metadata collection.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.nz.jnng.graalvm.GraalVmNativeMetadataApp'
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    if (providers.gradleProperty('agent').isPresent()) {
        def metadataDirectory = layout.buildDirectory.dir('native/agent-output')
        doFirst {
            delete metadataDirectory
            metadataDirectory.get().asFile.mkdirs()
        }
        jvmArgs "-agentlib:native-image-agent=config-output-dir=${metadataDirectory.get().asFile.absolutePath}"
    }
}
