plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.fabiitch'
version = '1.0-SNAPSHOT'

base { archivesName = 'J-Nng' }

sourceSets {
    main {
        java {
            srcDir("src/generated")
        }
    }
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}


repositories {
    mavenCentral()
}

dependencies {
    implementation("org.slf4j:slf4j-api:$slf4jVersion")

    testRuntimeOnly "org.apache.logging.log4j:log4j-api:$log4j2Version"
    testRuntimeOnly "org.apache.logging.log4j:log4j-core:$log4j2Version"
    testRuntimeOnly "org.apache.logging.log4j:log4j-slf4j2-impl:$log4j2Version"


    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"
}

compileTestJava {
    source += sourceSets.main.allJava
    classpath += sourceSets.main.output
}

test {
    useJUnitPlatform()
    classpath += sourceSets.main.output
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

def graalVmMetadataOutputDirectory = layout.buildDirectory.dir('native/agent-output')
def bundledGraalVmMetadataDirectory = layout.projectDirectory.dir(
        'src/main/resources/META-INF/native-image/com.fabiitch.jnng/J-NNG'
)
def bundledGraalVmMetadataFile = bundledGraalVmMetadataDirectory.file(
        'reachability-metadata.json'
)

def nativeImageAgentCandidates = [
        'bin/native-image-agent.dll',
        'lib/native-image-agent.dll',
        'lib/libnative-image-agent.so',
        'lib/libnative-image-agent.dylib',
]

def resolveGraalVmHome = {
    String configuredHome = providers.environmentVariable('GRAALVM_HOME').orNull
    File home = configuredHome == null || configuredHome.isBlank()
            ? file(System.getProperty('java.home'))
            : file(configuredHome)
    home.toPath().toAbsolutePath().normalize().toFile()
}

def resolveNativeImageAgent = { File home ->
    File agent = nativeImageAgentCandidates
            .collect { relativePath -> new File(home, relativePath) }
            .find { candidate -> candidate.isFile() }
    if (agent == null) {
        throw new GradleException(
                "native-image-agent not found under ${home}. " +
                        "Set GRAALVM_HOME to a GraalVM JDK 25 installation."
        )
    }
    agent
}

def java25Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}

tasks.register('graalvmMetadataApp', JavaExec) {
    group = 'verification'
    description = 'Exercises every native NNG call used by J-Nng.'
    dependsOn testClasses
    javaLauncher.set(java25Launcher)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fabiitch.jnng.graalvm.GraalVmNativeMetadataApp'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('generateGraalVmMetadata', Exec) {
    group = 'verification'
    description = 'Generates GraalVM reachability metadata with native-image-agent.'
    dependsOn testClasses
    outputs.file(graalVmMetadataOutputDirectory.map {
        it.file('reachability-metadata.json')
    })
    outputs.upToDateWhen { false }

    doFirst {
        File graalVmHome = resolveGraalVmHome()
        File javaExecutable = java25Launcher.get().executablePath.asFile
        File nativeImageAgent = resolveNativeImageAgent(graalVmHome)
        File metadataDirectory = graalVmMetadataOutputDirectory.get().asFile

        delete metadataDirectory
        metadataDirectory.mkdirs()

        commandLine(
                javaExecutable.absolutePath,
                '--enable-native-access=ALL-UNNAMED',
                "-agentpath:${nativeImageAgent.absolutePath}=config-output-dir=${metadataDirectory.absolutePath}",
                '-cp',
                sourceSets.test.runtimeClasspath.asPath,
                'com.fabiitch.jnng.graalvm.GraalVmNativeMetadataApp'
        )

        logger.lifecycle("Using Java executable: ${javaExecutable}")
        logger.lifecycle("Using GraalVM home for native-image-agent: ${graalVmHome}")
        logger.lifecycle("Writing GraalVM metadata to: ${metadataDirectory}")
    }

    doLast {
        File metadataFile = graalVmMetadataOutputDirectory.get()
                .file('reachability-metadata.json')
                .asFile
        if (!metadataFile.isFile()) {
            throw new GradleException("GraalVM metadata was not generated: ${metadataFile}")
        }
    }
}

tasks.register('refreshGraalVmMetadata', Copy) {
    group = 'verification'
    description = 'Generates and installs bundled GraalVM reachability metadata.'
    dependsOn tasks.named('generateGraalVmMetadata')

    from(graalVmMetadataOutputDirectory.map {
        it.file('reachability-metadata.json')
    })
    into bundledGraalVmMetadataDirectory

    doLast {
        if (!bundledGraalVmMetadataFile.asFile.isFile()) {
            throw new GradleException(
                    "Bundled GraalVM metadata was not written: ${bundledGraalVmMetadataFile.asFile}"
            )
        }
        logger.lifecycle("Updated bundled GraalVM metadata: ${bundledGraalVmMetadataFile.asFile}")
    }
}

publishing {
    publications {
        library(MavenPublication) { from components.java }
    }
}
